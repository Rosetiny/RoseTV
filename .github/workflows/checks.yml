name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: Expand-Archive runtime/python-runtime.zip runtime/python
      - run: .\runtime\python\python.exe -m unittest discover -s tools -p "test_*.py" -q
      - run: node source/tests/performance.mjs
      - run: .\runtime\python\python.exe tools/start.py --prepare-only
      - run: .\runtime\python\python.exe tools/build_local.py
